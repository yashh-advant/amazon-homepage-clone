<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Amazon Clone</title>
    <link rel="icon" href="./asset/amazon_icon.png">
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="m-0 p-0 bg-black overflow-x-hidden">

    <div class="flex flex-col bg-white min-h-screen w-full">

        <!-- HEADER -->
        <header class="w-full flex items-center bg-[#131921] h-[32px] text-white px-1 gap-1">

            <!-- LEFT -->
            <div class="flex items-center gap-1 shrink-0">
                <div class="flex items-center">
                    <img src="./asset/amazon_white_logo.png" class="w-[22px] h-[14px]" />
                    <span class="text-[9px] font-bold ml-[1px]">.in</span>
                </div>

                <div class="flex flex-col justify-center leading-none">
                    <span class="text-[6px]">Delivering to Surat</span>
                    <span class="text-[7px] font-bold">Update location</span>
                </div>
            </div>

            <!-- CENTER (SEARCH) -->
            <div class="flex flex-1 min-w-0 h-[18px]">
                <select class="w-[22px] bg-[#d4d4d4] text-[7px] appearance-none text-center text-black rounded-l-sm">
                    <option>All</option>
                </select>

                <input type="text" placeholder="Search"
                    class="flex-1 min-w-0 text-[7px] px-1 text-black outline-none" />

                <button class="w-[18px] bg-[#f3a847] rounded-r-sm flex items-center justify-center">
                    <img src="./asset/search.png" class="w-[14px] h-[14px]" />
                </button>
            </div>

            <!-- RIGHT -->
            <div class="flex items-center gap-1 shrink-0">

                <div class="flex items-center gap-[2px]">
                    <img src="./asset/india-flag-icon.webp" class="w-[9px] h-[7px]" />
                    <select class="text-[7px] font-bold appearance-none bg-transparent">
                        <option>EN</option>
                    </select>
                </div>

                <div class="text-[7px] font-bold leading-none">
                    <span class="block text-[6px] font-normal">Hello</span>
                    Account
                </div>

                <div class="text-[7px] font-bold leading-none">
                    <span class="block text-[6px] font-normal">Returns</span>
                    Orders
                </div>

                <img src="./asset/carts.png" class="w-[14px] h-[14px]" />
            </div>

        </header>

    </div>

    
</body>

</html>
